[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "0.4.0"
description = "Search index and ranking engine"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
findex = "findex.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "pyright>=1.1.0",
    "ruff>=0.1.0",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (select with '-m slow')",
]